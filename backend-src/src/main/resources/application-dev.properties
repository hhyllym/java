server.port=8081

# ================= 数据库（小马王国 mlp_login） =================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mlp_login?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ================= MyBatis-Plus =================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# XML 动态 SQL 位置（首页搜索用的 PonyMapper.xml 就在这）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 想看执行的 SQL 就把下面这行前面的 # 去掉（控制台会比较吵）
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false
