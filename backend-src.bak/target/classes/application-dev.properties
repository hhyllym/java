server.port=8081
# 绑定到所有网卡，使其他设备能用「本机局域网 IP:8081」直接访问后端
server.address=0.0.0.0

# ================= 局域网 IP（大富翁联机 / 好友分享网址用） =================
# 机器常挂多张网卡，自动探测容易挑错；这里固定成你要用的局域网 IP。
# 前端 /api/monopoly/lan 会把这条 IP 拼进「发给同学的大富翁网址」。
app.lan-ip=192.168.68.10

# ================= 数据库（星糖谷 mlp_login） =================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/mlp_login?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ================= MyBatis-Plus =================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# XML 动态 SQL 位置（首页搜索用的 PonyMapper.xml 就在这）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 想看执行的 SQL 就把下面这行前面的 # 去掉（控制台会比较吵）
# mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

# ================= 后台管理系统 · 令牌密钥 =================
# 后台管理系统的登录账号就是星糖谷注册用户（t_user），
# 只有 permission=0 的账号才能登录后台；管理员账号默认由 sql\mlp_login.sql 预置（admin / Admin@1234，明文）。
# 下面只是令牌签名密钥，和账号密码无关，上线前建议改掉。
app.admin.secret=mlp-admin-2026-secret
