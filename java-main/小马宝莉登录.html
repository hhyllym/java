<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小马王国 · 账号中心</title>
<style>
  :root {
    --pink: #f7a8c4;
    --purple: #b79cf0;
    --blue: #8fc7f0;
    --mint: #a7e3c9;
    --yellow: #f7e08a;
    --primary: #a06cd5;
    --primary-hover: #8a55c4;
    --text: #4a3f5c;
    --muted: #9088a0;
    --border: #ece6f3;
    --danger: #e06666;
    --success: #4caf7d;
    --radius: 18px;
    --shadow: 0 16px 40px rgba(160, 108, 213, 0.18);
    --card: #ffffff;
    --panel: #f6f1fb;
    --track: #eeeeee;
    --cloud: rgba(255,255,255,.55);
  }

  /* ========== 主题（点击卡片右上角色点切换） ========== */
  body[data-theme="twilight"] {
    --pink: #c9b3f5; --purple: #8f7ae8; --blue: #9fb4f2;
    --primary: #7c5cbf; --primary-hover: #6a4ba8;
    --text: #3d3355; --muted: #8d84a8; --border: #e4dcf5; --panel: #efe9fb;
    background-image: linear-gradient(135deg, #efe6fc 0%, #e2d9fb 45%, #dfe7fc 70%, #efe0fb 100%);
  }
  body[data-theme="dash"] {
    --pink: #a8d8f7; --purple: #7fb8e8; --blue: #6ec6e6;
    --primary: #3f8fd6; --primary-hover: #3278b8;
    --text: #2f4358; --muted: #7e93a8; --border: #d9e9f5; --panel: #e8f3fb;
    background-image: linear-gradient(135deg, #e0f2fc 0%, #d5e8fb 45%, #d8f4f7 70%, #e6e6fc 100%);
  }
  body[data-theme="applejack"] {
    --pink: #f5c08a; --purple: #f0a868; --blue: #a8d8f7;
    --primary: #d98a3d; --primary-hover: #bf7430;
    --text: #57432f; --muted: #a08a70; --border: #f3e4d3; --panel: #fbf0e2;
    background-image: linear-gradient(135deg, #fdeedd 0%, #fbe3cc 45%, #fdeede 70%, #fce8d8 100%);
  }
  body[data-theme="fluttershy"] {
    --pink: #b8ecd2; --purple: #8fd9b8; --blue: #a8e0d0;
    --primary: #58b98a; --primary-hover: #47a376;
    --text: #35513f; --muted: #86a894; --border: #d9efe2; --panel: #e8f7ee;
    background-image: linear-gradient(135deg, #e4f8ee 0%, #dcf2e8 45%, #e4f6f0 70%, #eef8e4 100%);
  }
  body[data-theme="night"] {
    --pink: #e08ac0; --purple: #9b6dd6; --blue: #6ea8d8;
    --primary: #c39bf0; --primary-hover: #b287e0;
    --text: #ece7f5; --muted: #a79fc0; --border: #3a3153;
    --card: #2b2440; --panel: #241e35; --track: #3a3153;
    --shadow: 0 16px 40px rgba(0,0,0,.45);
    --cloud: rgba(255,255,255,.08);
    background-image: linear-gradient(135deg, #1e1830 0%, #251d3a 45%, #1a2333 70%, #2a1e35 100%);
  }

  /* 主题切换器 */
  .themes {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 20px 0; position: relative; z-index: 2;
  }
  .theme-dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid #fff; background: var(--dot); cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
    transition: transform .15s ease;
  }
  .theme-dot:hover { transform: scale(1.25); }
  .theme-dot.active { outline: 2px solid var(--primary); outline-offset: 2px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fde7f1 0%, #ece4fb 45%, #e2f3fb 70%, #fbe3f0 100%);
    background-size: 280% 280%;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    min-height: 100vh;
    overflow: hidden;
    animation: bgShift 20s ease infinite;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    width: 100%; max-width: 400px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(255,255,255,.7);
    animation: cardIn .6s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  /* 顶部彩虹条 */
  .rainbow {
    height: 8px;
    background: linear-gradient(90deg,
      #f7a8c4 0%, #f7e08a 20%, #a7e3c9 40%,
      #8fc7f0 60%, #b79cf0 80%, #f7a8c4 100%);
  }
  .head { padding: 26px 28px 6px; text-align: center; }
  .logo {
    width: 52px; height: 52px; margin: 0 auto 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    box-shadow: 0 6px 14px rgba(160,108,213,.28);
    animation: bob 3.5s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .head h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .5px; }
  .head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

  .tabs {
    display: flex; margin: 22px 28px 0;
    background: var(--panel); border-radius: 12px; padding: 4px;
  }
  .tab {
    flex: 1; text-align: center; padding: 9px 0;
    font-size: 14px; color: var(--muted); cursor: pointer;
    border-radius: 9px; user-select: none; transition: all .18s ease;
  }
  .tab.active {
    background: var(--card); color: var(--primary); font-weight: 700;
    box-shadow: 0 1px 5px rgba(0,0,0,.06);
  }

  form { padding: 18px 28px 28px; }
  .field { margin-bottom: 15px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; padding: 11px 42px 11px 13px;
    border: 1.5px solid var(--border); border-radius: 11px;
    font-size: 14px; color: var(--text); background: var(--card);
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(160,108,213,.15);
  }
  input.invalid { border-color: var(--danger); }
  .toggle-pw {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 12px; padding: 4px;
  }
  .err { color: var(--danger); font-size: 12px; margin-top: 5px; min-height: 14px; }
  .strength { height: 5px; border-radius: 4px; background: var(--track); margin-top: 8px; overflow: hidden; }
  .strength > span { display: block; height: 100%; width: 0%; transition: width .25s, background .25s; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 18px; }
  .row label { margin: 0; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .row a { color: var(--primary); text-decoration: none; }
  .row a:hover { text-decoration: underline; }
  button.submit {
    width: 100%; padding: 12px; border: none; border-radius: 11px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: filter .15s, transform .05s;
    position: relative; overflow: hidden;
  }
  button.submit::after {
    content: ""; position: absolute; top: 0; left: -60%;
    width: 45%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg);
  }
  button.submit:hover { filter: brightness(1.05); }
  button.submit:hover::after { animation: shine .7s ease; }
  button.submit:active { transform: translateY(1px); }
  @keyframes shine { to { left: 130%; } }
  .hidden { display: none !important; }

  /* 主页 */
  .dash { padding: 30px 28px; text-align: center; }
  .avatar {
    width: 66px; height: 66px; margin: 0 auto 14px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: #fff; font-size: 28px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(160,108,213,.3);
  }
  .dash h2 { margin: 0 0 4px; font-size: 20px; }
  .dash .mail { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .dash .meta { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .dash button {
    width: 100%; padding: 11px; border-radius: 11px;
    border: 1.5px solid var(--border); background: var(--card); cursor: pointer;
    font-size: 14px; color: var(--text); transition: background .15s;
  }
  .dash button:hover { background: var(--panel); }

  .toast {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #4a3f5c; color: #fff; padding: 11px 18px; border-radius: 12px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--success); }
  .toast.err { background: var(--danger); }

  /* 背景装饰：云朵与星光 */
  .sky { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .cloud {
    position: absolute; background: var(--cloud);
    border-radius: 100px; filter: blur(1px);
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 55px; height: 55px; top: -24px; left: 18px; }
  .cloud::after { width: 38px; height: 38px; top: -14px; left: 58px; }
  .c1 { width: 120px; height: 38px; top: 14%; left: -140px; animation: drift 38s linear infinite; }
  .c2 { width: 90px; height: 30px; top: 62%; left: -120px; opacity: .8; animation: drift 50s linear infinite 6s; }
  .c3 { width: 140px; height: 44px; top: 82%; left: -160px; opacity: .7; animation: drift 60s linear infinite 3s; }
  @keyframes drift { to { transform: translateX(120vw); } }
  .sparkle {
    position: absolute; color: #fff; opacity: .55;
    animation: twinkle 3.4s ease-in-out infinite;
    text-shadow: 0 0 6px rgba(255,255,255,.85);
  }
  @keyframes twinkle {
    0%,100% { opacity: .2; transform: scale(.8) rotate(0deg); }
    50% { opacity: .95; transform: scale(1.25) rotate(20deg); }
  }

  /* 背景里的小马成员（原创简笔剪影，六种招牌色） */
  .pony {
    position: absolute; opacity: .4; z-index: 0;
    animation: ponyFloat 9s ease-in-out infinite;
    filter: drop-shadow(0 5px 10px rgba(120,90,160,.10));
  }
  .pony svg { display: block; }
  @keyframes ponyFloat {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
  }
</style>
</head>
<body>
  <div class="sky">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <span class="sparkle" style="top:12%;left:18%;font-size:18px;animation-delay:.2s">✦</span>
    <span class="sparkle" style="top:24%;left:78%;font-size:14px;animation-delay:1.1s">✧</span>
    <span class="sparkle" style="top:40%;left:30%;font-size:20px;animation-delay:.6s">★</span>
    <span class="sparkle" style="top:55%;left:85%;font-size:14px;animation-delay:1.6s">✦</span>
    <span class="sparkle" style="top:70%;left:14%;font-size:16px;animation-delay:.9s">✧</span>
    <span class="sparkle" style="top:82%;left:60%;font-size:18px;animation-delay:1.3s">★</span>
    <span class="sparkle" style="top:33%;left:62%;font-size:13px;animation-delay:2.1s">✦</span>
    <span class="sparkle" style="top:90%;left:40%;font-size:15px;animation-delay:.4s">✧</span>
  </div>

  <script>
  (function () {
    var ponies = [
      { c: "#b79cf0", x: "3%",  y: "10%", s: 98,  d: 0   },
      { c: "#8fc7f0", x: "78%", y: "14%", s: 86,  d: 1.4 },
      { c: "#f7a8c4", x: "4%",  y: "56%", s: 92,  d: 2.2 },
      { c: "#f3c969", x: "80%", y: "52%", s: 90,  d: .8  },
      { c: "#f0a06a", x: "6%",  y: "85%", s: 82,  d: 1.9 },
      { c: "#a9d6e5", x: "76%", y: "84%", s: 94,  d: 3.0 }
    ];
    var svg = '<svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">' +
      '<g fill="COLOR">' +
      '<rect x="32" y="66" width="9" height="26" rx="4"/>' +
      '<rect x="44" y="66" width="9" height="26" rx="4"/>' +
      '<rect x="74" y="66" width="9" height="26" rx="4"/>' +
      '<rect x="86" y="66" width="9" height="26" rx="4"/>' +
      '<ellipse cx="55" cy="56" rx="32" ry="18"/>' +
      '<path d="M80 52 q8 -22 24 -26 l6 9 q-14 6 -16 26 z"/>' +
      '<ellipse cx="102" cy="30" rx="14" ry="12"/>' +
      '<ellipse cx="115" cy="36" rx="7" ry="5"/>' +
      '<path d="M99 20 l3 -12 l9 8 z"/>' +
      '<path d="M90 22 q-12 2 -10 18 q8 -8 14 -5 q-4 -10 6 -13 z"/>' +
      '<path d="M24 50 q-14 4 -12 26 q9 -9 15 -7 q-5 -11 1 -19 z"/>' +
      '</g></svg>';
    var sky = document.querySelector(".sky");
    ponies.forEach(function (p) {
      var el = document.createElement("div");
      el.className = "pony";
      el.style.left = p.x; el.style.top = p.y;
      el.style.width = p.s + "px";
      el.style.animationDelay = p.d + "s";
      el.style.animationDuration = (8 + p.d) + "s";
      el.innerHTML = svg.replace("COLOR", p.c);
      sky.appendChild(el);
    });
  })();
  </script>

  <div class="card">
    <div class="rainbow"></div>
    <div class="themes">
      <button class="theme-dot" data-theme="default" style="--dot:#f7a8c4" title="碧琪粉（默认）"></button>
      <button class="theme-dot" data-theme="twilight" style="--dot:#8f7ae8" title="紫悦紫"></button>
      <button class="theme-dot" data-theme="dash" style="--dot:#6ec6e6" title="云宝蓝"></button>
      <button class="theme-dot" data-theme="applejack" style="--dot:#f0a06a" title="苹果橙"></button>
      <button class="theme-dot" data-theme="fluttershy" style="--dot:#7fd4a8" title="柔柔绿"></button>
      <button class="theme-dot" data-theme="night" style="--dot:#3a3153" title="坎特洛特之夜"></button>
    </div>
    <div id="auth">
      <div class="head">
        <div class="logo">🦄</div>
        <h1>小马王国</h1>
        <p>友谊的魔法，从登录开始 ✨</p>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="login">登录</div>
        <div class="tab" data-tab="register">注册</div>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">邮箱</label>
          <div class="input-wrap">
            <input type="email" id="loginEmail" placeholder="twilight@example.com" autocomplete="username" />
            <button type="button" class="toggle-pw" data-target="loginEmail">显示</button>
          </div>
          <div class="err" id="loginEmailErr"></div>
        </div>
        <div class="field">
          <label for="loginPw">魔法密码</label>
          <div class="input-wrap">
            <input type="password" id="loginPw" placeholder="请输入密码" autocomplete="current-password" />
            <button type="button" class="toggle-pw" data-target="loginPw">显示</button>
          </div>
          <div class="err" id="loginPwErr"></div>
        </div>
        <div class="row">
          <label><input type="checkbox" id="remember" /> 记住我</label>
          <a href="#" id="forgot">忘记魔法密码？</a>
        </div>
        <button type="submit" class="submit">进入小马王国 🌈</button>
      </form>

      <form id="registerForm" class="hidden" novalidate>
        <div class="field">
          <label for="regName">小马名字</label>
          <div class="input-wrap">
            <input type="text" id="regName" placeholder="2-20 个字符" autocomplete="nickname" />
          </div>
          <div class="err" id="regNameErr"></div>
        </div>
        <div class="field">
          <label for="regEmail">邮箱</label>
          <div class="input-wrap">
            <input type="email" id="regEmail" placeholder="pinkie@example.com" autocomplete="username" />
            <button type="button" class="toggle-pw" data-target="regEmail">显示</button>
          </div>
          <div class="err" id="regEmailErr"></div>
        </div>
        <div class="field">
          <label for="regPw">设置密码</label>
          <div class="input-wrap">
            <input type="password" id="regPw" placeholder="至少 6 位，含字母和数字" autocomplete="new-password" />
            <button type="button" class="toggle-pw" data-target="regPw">显示</button>
          </div>
          <div class="strength"><span id="strengthBar"></span></div>
          <div class="err" id="regPwErr"></div>
        </div>
        <div class="field">
          <label for="regPw2">确认密码</label>
          <div class="input-wrap">
            <input type="password" id="regPw2" placeholder="再次输入密码" autocomplete="new-password" />
            <button type="button" class="toggle-pw" data-target="regPw2">显示</button>
          </div>
          <div class="err" id="regPw2Err"></div>
        </div>
        <button type="submit" class="submit">加入我们 🎀</button>
      </form>
    </div>

    <div id="dash" class="dash hidden">
      <div class="avatar" id="dashAvatar">🦄</div>
      <h2 id="dashName">小马</h2>
      <div class="mail" id="dashMail"></div>
      <div class="meta" id="dashMeta"></div>
      <button id="logoutBtn">退出登录</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var USERS_KEY = "mlp_users";
  var SESSION_KEY = "mlp_session";
  var $ = function (id) { return document.getElementById(id); };

  function getUsers() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveUsers(list) { localStorage.setItem(USERS_KEY, JSON.stringify(list)); }

  function toast(msg, type) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show " + (type || "");
    setTimeout(function () { t.className = "toast " + (type || ""); }, 2200);
  }
  function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      var name = tab.getAttribute("data-tab");
      $("loginForm").classList.toggle("hidden", name !== "login");
      $("registerForm").classList.toggle("hidden", name !== "register");
    });
  });

  document.querySelectorAll(".toggle-pw").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var el = $(btn.getAttribute("data-target"));
      if (el.type === "password") { el.type = "text"; btn.textContent = "隐藏"; }
      else { el.type = "password"; btn.textContent = "显示"; }
    });
  });

  $("regPw").addEventListener("input", function () {
    var v = this.value, score = 0;
    if (v.length >= 6) score++;
    if (/[a-z]/i.test(v) && /[0-9]/.test(v)) score++;
    if (v.length >= 10 || /[^a-zA-Z0-9]/.test(v)) score++;
    var colors = ["#e06666", "#f0a93a", "#4caf7d"];
    var bar = $("strengthBar");
    bar.style.width = (score / 3 * 100) + "%";
    bar.style.background = colors[score - 1] || "#eee";
  });

  function setErr(id, msg) {
    $(id).textContent = msg || "";
    var input = $(id.replace("Err", ""));
    if (input) input.classList.toggle("invalid", !!msg);
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = $("loginEmail").value.trim();
    var pw = $("loginPw").value;
    setErr("loginEmailErr", ""); setErr("loginPwErr", "");
    if (!isEmail(email)) { setErr("loginEmailErr", "请输入有效的邮箱地址"); return; }
    if (!pw) { setErr("loginPwErr", "请输入密码"); return; }
    var users = getUsers();
    var user = users.find(function (u) { return u.email === email; });
    if (!user) { setErr("loginEmailErr", "这匹小马还没注册哦"); return; }
    if (user.password !== pw) { setErr("loginPwErr", "魔法密码不正确"); return; }
    var session = { email: user.email, name: user.name, ts: Date.now() };
    if ($("remember").checked) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    else { sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); localStorage.removeItem(SESSION_KEY); }
    toast("登录成功，欢迎回家！🌟", "ok");
    showDash(session);
  });

  $("registerForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("regName").value.trim();
    var email = $("regEmail").value.trim();
    var pw = $("regPw").value, pw2 = $("regPw2").value;
    setErr("regNameErr", ""); setErr("regEmailErr", "");
    setErr("regPwErr", ""); setErr("regPw2Err", "");
    if (name.length < 2 || name.length > 20) { setErr("regNameErr", "名字需 2-20 个字符"); return; }
    if (!isEmail(email)) { setErr("regEmailErr", "请输入有效的邮箱地址"); return; }
    if (pw.length < 6 || !(/[a-z]/i.test(pw) && /[0-9]/.test(pw))) {
      setErr("regPwErr", "密码至少 6 位，且含字母和数字"); return;
    }
    if (pw !== pw2) { setErr("regPw2Err", "两次输入的密码不一致"); return; }
    var users = getUsers();
    if (users.some(function (u) { return u.email === email; })) {
      setErr("regEmailErr", "这个小马邮箱已经被用啦"); return;
    }
    users.push({ name: name, email: email, password: pw, created: Date.now() });
    saveUsers(users);
    toast("注册成功，快去登录吧 🎉", "ok");
    document.querySelector('.tab[data-tab="login"]').click();
    $("loginEmail").value = email; $("loginPw").value = "";
    $("registerForm").reset(); $("strengthBar").style.width = "0%";
  });

  $("forgot").addEventListener("click", function (e) {
    e.preventDefault();
    var email = prompt("请输入你的小马邮箱，我们会发送重置链接（演示）：");
    if (email && isEmail(email)) toast("重置链接已发送至 " + email + "（演示）", "ok");
    else if (email) toast("邮箱格式不正确", "err");
  });

  function showDash(session) {
    $("auth").classList.add("hidden");
    $("dash").classList.remove("hidden");
    $("dashName").textContent = session.name || "小马";
    $("dashMail").textContent = session.email;
    var d = new Date(session.ts);
    $("dashMeta").textContent = "上次登录：" + d.toLocaleString("zh-CN");
  }

  $("logoutBtn").addEventListener("click", function () {
    localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem(SESSION_KEY);
    $("dash").classList.add("hidden"); $("auth").classList.remove("hidden");
    $("loginForm").reset(); toast("已退出登录，拜拜 👋", "ok");
  });

  // 主题切换
  var THEME_KEY = "mlp_theme";
  var dots = document.querySelectorAll(".theme-dot");
  function applyTheme(t) {
    if (t === "default") document.body.removeAttribute("data-theme");
    else document.body.setAttribute("data-theme", t);
    dots.forEach(function (d) {
      d.classList.toggle("active", d.getAttribute("data-theme") === t);
    });
  }
  dots.forEach(function (d) {
    d.addEventListener("click", function () {
      var t = d.getAttribute("data-theme");
      applyTheme(t);
      try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    });
  });

  (function init() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    applyTheme(saved || "default");
    var s = localStorage.getItem(SESSION_KEY) || sessionStorage.getItem(SESSION_KEY);
    if (s) { try { showDash(JSON.parse(s)); } catch (e) {} }
  })();
})();
</script>
</body>
</html>
